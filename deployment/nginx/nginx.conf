# ==============================================================================
# Nginx Configuration for AI Road Surveillance & Streaming Gateway
# Supports WebSocket bidirectional proxying and unbuffered MJPEG streaming
# ==============================================================================

upstream backend_service {
    server road-ai-backend:7860;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost _;

    # Client payload and upload limits
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 1. Real-Time WebSocket Telemetry Channel
    location /ws/detections {
        proxy_pass http://backend_service/ws/detections;
        proxy_http_version 1.1;

        # Mandatory WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward client host and IP info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable timeouts for continuous streaming connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Live MJPEG Annotated Video Stream
    location /api/v1/camera/stream {
        proxy_pass http://backend_service/api/v1/camera/stream;
        proxy_http_version 1.1;

        # Disable buffering and caching for real-time video delivery
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 86400s;
    }

    # 3. Incident Snapshots (Cached Static Files)
    location /snapshots/ {
        alias /storage/snapshots/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 4. REST API & Integrated Dashboard Frontend
    location / {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
